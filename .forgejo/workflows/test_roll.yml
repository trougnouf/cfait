name: Test and Rolling Release

on:
  push:
    branches:
      - "master"
    tags-ignore:
      - '*'
  pull_request:

jobs:
  # --- JOB: keep rolling release live (best-effort) ---
  # The codeberg->disroot push mirror runs `git push --mirror`, which deletes
  # the `rolling` tag (codeberg has no such tag). When a release's tag
  # disappears, Forgejo turns the release into a detached draft, and since
  # CVE-2026-27660 draft attachments 404 for non-writers, the rolling release
  # becomes undownloadable for everyone but the owner until publish-rolling
  # re-tags it at the end of the run.
  #
  # This job makes a single best-effort attempt to un-draft the release a few
  # minutes into the run, after the mirror has had time to delete the tag.
  # Un-drafting via the API re-creates the `rolling` tag and re-anchors the
  # release, keeping the packages downloadable during the build. If the attempt
  # lands before the mirror syncs, the mirror re-drafts it and publish-rolling
  # heals it at the end anyway.
  keep-rolling-live:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: self-hosted-ubuntu
    container:
      image: local/ubuntu-builder
    continue-on-error: true
    steps:
      - name: Un-draft the rolling release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          # Give the codeberg mirror time to sync and delete the tag first.
          sleep 180

          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases"
          AUTH="Authorization: token ${RELEASE_TOKEN}"

          ID=$(curl -s -H "$AUTH" "$API/tags/rolling" | tr -d '[:space:]' | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          if [ -n "$ID" ]; then
            curl -s -o /dev/null -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
              -d '{"draft": false}' "$API/$ID"
            echo "Un-drafted rolling release (id ${ID}); the rolling tag was re-created."
          else
            echo "No rolling release found; nothing to heal."
          fi

  # --- JOB 1: VALIDATION ---
  test:
    runs-on: self-hosted-arch
    container:
      image: local/arch-builder
      volumes:
        - cargo-registry:/usr/local/cargo/registry
      env:
        RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run linter (clippy)
        run: cargo clippy --all-features --all-targets --locked -- -D warnings

      - name: Run unit tests
        run: cargo test --all-features --all-targets --locked --verbose

  # --- JOB 2: ROLLING ANDROID (Only on PUSH) ---
  rolling-android:
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: self-hosted-ubuntu
    container:
      image: local/ubuntu-builder
      volumes:
        - cargo-registry:/usr/local/cargo/registry
        - gradle-cache:/root/.gradle
      env:
        RUSTFLAGS: "--remap-path-prefix ${{ github.workspace }}=/c --remap-path-prefix /usr/local/cargo=/cargo -C link-arg=-Wl,--build-id=none"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}" | base64 --decode > cfait-rolling.keystore
          else
            echo "Secrets not available (fork PR). Generating a temporary dummy keystore for the release build."
            keytool -genkey -v \
              -keystore cfait-rolling.keystore \
              -alias cfait-rolling \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass dummypassword \
              -keypass dummypassword \
              -dname "CN=Cfait, OU=Cfait, O=Cfait, C=BE"
          fi

      - name: Build Rust JNI Libs
        run: |
          cargo ndk \
            -t aarch64-linux-android \
            -t armv7-linux-androideabi \
            -t x86_64-linux-android \
            -o ./android/app/src/main/jniLibs \
            --platform 28 \
            build --release --lib --features mobile --locked

      - name: Build Signed Android APK
        env:
          KEYSTORE_FILE: "${{ github.workspace }}/cfait-rolling.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'dummypassword' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'cfait-rolling' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'dummypassword' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Artifact
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/*.apk dist-android/cfait-android-rolling.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v3
        with:
          name: rolling-android
          path: dist-android/*
          retention-days: 1

  # --- JOB 4: ROLLING FLATPAK ---
  rolling-flatpak:
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: self-hosted-arch
    container:
      image: local/arch-builder
      options: --privileged
      volumes:
        - cargo-registry:/usr/local/cargo/registry
        - flatpak-builder-cache:/flatpak-cache
        - flatpak-user-dir:/home/builder/.local/share/flatpak
      env:
        RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate cargo-sources.yml
        run: |
          mkdir -p /flatpak-cache
          if [ ! -f /flatpak-cache/flatpak-cargo-generator.py ]; then
            wget https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py -O /flatpak-cache/flatpak-cargo-generator.py
          fi
          python3 /flatpak-cache/flatpak-cargo-generator.py Cargo.lock -o cargo-sources.yml

      - name: Prepare Manifest for Rolling
        run: |
          python3 -c "
          import yaml
          with open('com.trougnouf.Cfait.yml', 'r') as f:
              data = yaml.safe_load(f)
          # Replace the first source (the git repo) with a local directory reference
          data['modules'][0]['sources'][0] = {'type': 'dir', 'path': '.'}
          with open('com.trougnouf.Cfait.yml', 'w') as f:
              yaml.dump(data, f)
          "

      - name: Build Flatpak Bundle
        run: |
          mkdir -p /flatpak-cache /home/builder/.local/share/flatpak
          chown -R builder:builder . /flatpak-cache /home/builder/.local/share/flatpak
          su builder -c "flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo"
          su builder -c "flatpak-builder --user --disable-rofiles-fuse --force-clean --state-dir=/flatpak-cache --repo=repo build-dir com.trougnouf.Cfait.yml"
          su builder -c "flatpak build-bundle repo cfait-rolling.flatpak com.trougnouf.Cfait"

      - name: Prepare Artifact
        run: |
          mkdir -p dist-flatpak
          mv cfait-rolling.flatpak dist-flatpak/

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v3
        with:
          name: rolling-flatpak
          path: dist-flatpak/*
          retention-days: 1

  # --- JOB 3: ROLLING WINDOWS (Only on PUSH) ---
  rolling-windows:
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: self-hosted-arch
    container:
      image: local/arch-builder
      volumes:
        - cargo-registry:/usr/local/cargo/registry
      env:
        RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Windows Binaries
        run: |
          cargo build --release --target x86_64-pc-windows-gnu --features gui --locked

      - name: Create Windows Archive
        run: |
          mkdir -p windows-staging
          cp target/x86_64-pc-windows-gnu/release/cfait.exe windows-staging/
          cp target/x86_64-pc-windows-gnu/release/cfait-gui.exe windows-staging/cfait-gui.exe
          cp README.md LICENSE windows-staging/
          mkdir -p dist-windows
          (cd windows-staging && zip -r "../dist-windows/cfait-windows-rolling.zip" .)

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v3
        with:
          name: rolling-windows
          path: dist-windows/*
          retention-days: 1

  # --- JOB: ROLLING LINUX BINARY ---
  rolling-linux:
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: self-hosted-ubuntu
    container:
      image: local/ubuntu-builder
      volumes:
        - cargo-registry:/usr/local/cargo/registry
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Linux Binaries
        run: |
          export AWS_LC_SYS_NO_JITTER_ENTROPY=1
          cargo build --release --features gui --locked

      - name: Create Linux Tarball
        run: |
          mkdir -p cfait-linux-rolling
          cp target/release/cfait "cfait-linux-rolling/"
          cp target/release/cfait-gui "cfait-linux-rolling/cfait-gui"
          cp README.md LICENSE "cfait-linux-rolling/"
          cp assets/cfait.desktop "cfait-linux-rolling/"
          cp assets/cfait.svg "cfait-linux-rolling/"
          mkdir -p dist-linux
          tar -cJvf "dist-linux/cfait-linux-rolling.tar.xz" "cfait-linux-rolling"

      - name: Sign Release Artifacts
        env:
          GPG_SIGNING_SUBKEY: ${{ secrets.GPG_SIGNING_SUBKEY }}
          GPG_KEY_FINGERPRINT: ${{ secrets.GPG_KEY_FINGERPRINT }}
        run: |
          echo "$GPG_SIGNING_SUBKEY" | base64 --decode | gpg --import --batch --pinentry-mode loopback
          cd dist-linux
          gpg --batch --yes --pinentry-mode loopback --passphrase '' \
            --local-user "$GPG_KEY_FINGERPRINT" \
            --detach-sign --armor cfait-linux-rolling.tar.xz

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v3
        with:
          name: rolling-linux
          path: dist-linux/*
          retention-days: 1

  # --- JOB 5: PUBLISH ROLLING RELEASE ---
  publish-rolling:
    needs: [rolling-android, rolling-windows, rolling-flatpak, rolling-linux]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: self-hosted-ubuntu
    container:
      image: local/ubuntu-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v3
        with:
          path: dist

      - name: Update Rolling Release on git.disroot.org
        env:
          TEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          tea login add --name disroot --url ${{ github.server_url }} --token ${{ secrets.RELEASE_TOKEN }}
          REPO="${{ github.repository }}"
          TAG_NAME="rolling"

          # 1. Tag the release
          git config --global user.name "Cfait Release Bot"
          git config --global user.email "bot@trougnouf.com"
          git tag -f "$TAG_NAME"
          git push origin "$TAG_NAME" -f
          sleep 5

          # 2. Flatten the directory structure
          # Moves files from subfolders (like dist/rolling-android/cfait.apk) to dist/
          cd dist
          find . -mindepth 2 -type f -exec mv -t . {} +

          # 4. Delete existing release for this tag
          tea release delete --repo "$REPO" --confirm "$TAG_NAME" || true

          # 5. Build the asset arguments array
          ASSETS=()
          for file in *; do
            if [ -f "$file" ]; then
              ASSETS+=("--asset" "$file")
              echo "Queued for upload: $file"
            fi
          done

          # 6. Re-create the release with ALL assets attached in one command
          tea release create \
            --repo "$REPO" \
            --title "Rolling Development Build" \
            --note "Automated development build (Commit: ${{ github.sha }})." \
            --prerelease \
            "${ASSETS[@]}" \
            "$TAG_NAME"

          echo "✅ Rolling release updated successfully with all assets!"

  # --- JOB: BENCHMARK (report-only, runs after the rolling uploads) ---
  # Runs the criterion benchmarks in `benches/` and uploads the timing output
  # plus the per-benchmark reports as an artifact. This job is non-gating: a
  # regression or a bench crash does not fail the PR/master push.
  #
  # It is sequenced after the rolling artifact uploads (needs the rolling
  # jobs) so the ~5-minute bench run never delays the release artifacts. It
  # only requires `test` to have passed (don't bench broken code); a failed
  # rolling build does not block it.
  bench:
    needs: [test, rolling-android, rolling-windows, rolling-flatpak, rolling-linux]
    if: always() && needs.test.result == 'success'
    runs-on: self-hosted-arch
    container:
      image: local/arch-builder
      volumes:
        - cargo-registry:/usr/local/cargo/registry
      env:
        RUSTFLAGS: "-C debuginfo=0"
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print system load
        run: |
          echo "=== Benchmark environment ==="
          echo "Date: $(date -u)"
          echo "Hostname: $(cat /proc/sys/kernel/hostname 2>/dev/null || echo unknown)"
          echo "--- CPU ---"
          nproc
          grep -m1 "model name" /proc/cpuinfo || true
          echo "--- Load average (1/5/15 min) ---"
          cat /proc/loadavg
          uptime || true
          echo "--- Memory ---"
          free -h || true

      - name: Run benchmarks (criterion)
        continue-on-error: true
        run: |
          cargo bench --bench core --locked 2>&1 | tee bench-output.txt

      - name: Package criterion reports
        if: always()
        run: |
          if [ -d target/criterion ]; then
            # zstd -19: ~64% smaller than gzip with fast decode.
            # The HTML summary is at criterion/report/index.html inside the archive.
            ZSTD_CLEVEL=19 tar --zstd -cf criterion-reports.tar.zst -C target criterion
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bench-results-${{ github.sha }}
          path: |
            bench-output.txt
            criterion-reports.tar.zst
          retention-days: 14
